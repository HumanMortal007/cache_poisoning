events {
    worker_connections 1024;
}

http {
    # Define cache path and settings
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=100m inactive=60m use_temp_path=off;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format custom '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'Host Header: "$http_host" '
                      'Cache Status: "$upstream_cache_status"';

    access_log /var/log/nginx/access.log custom;
    error_log /var/log/nginx/error.log;

    server {
        listen 80;
        server_name localhost;

        # VULNERABILITY 1: The cache key only relies on the URI path ($uri).
        # It DOES NOT include the Host header ($host or $http_host).
        proxy_cache_key $uri;

        location / {
            # Enable caching
            proxy_cache my_cache;
            
            # Cache 200 OK responses for 10 minutes
            proxy_cache_valid 200 10m;
            
            # Allow serving stale content if upstream is down
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;

            # VULNERABILITY 2: Forwarding the client's Host header directly to the backend
            # without validation. The backend Flask app trusts this header implicitly.
            proxy_set_header Host $http_host;
            
            # Standard proxy headers
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Add custom header to see cache status (HIT/MISS/BYPASS) in the response
            add_header X-Cache-Status $upstream_cache_status;

            # Forward to Flask backend
            proxy_pass http://flask_app:5000;
        }

        # Do not cache API health checks
        location /api/health {
            proxy_pass http://flask_app:5000;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }
    }
}
