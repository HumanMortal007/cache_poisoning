events {
    worker_connections 1024;
}

http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=100m inactive=60m use_temp_path=off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format custom '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'Host Header: "$http_host" '
                      'Cache Status: "$upstream_cache_status"';

    access_log /var/log/nginx/access.log custom;
    error_log /var/log/nginx/error.log;

    server {
        listen 80;
        
        # MITIGATION 1: Explicitly define allowed server names
        # Requests not matching these will fall through or be rejected
        server_name localhost 127.0.0.1 demo.local;

        # MITIGATION 2: Include the Host header in the cache key
        # Now, a request with Host: attacker.com will generate a different cache key
        # than a request with Host: localhost. The poison is contained.
        proxy_cache_key $http_host$uri;

        location / {
            proxy_cache my_cache;
            proxy_cache_valid 200 10m;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;

            # MITIGATION 3: Use the validated $host variable instead of $http_host
            # $host equals the server_name if present, or the valid Host header.
            # If an attacker sends a weird Host header, Nginx uses the primary server_name instead.
            proxy_set_header Host $host;
            
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://flask_app:5000;
        }

        location /api/health {
            proxy_pass http://flask_app:5000;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }
    }

    # MITIGATION 4: Default server block to drop requests with unrecognized Host headers
    # This prevents the application from even processing requests targeting unknown domains
    server {
        listen 80 default_server;
        server_name _; # Match any unconfigured hostname
        
        # Return 444 (Connection Closed Without Response) for invalid hosts
        return 444; 
    }
}
